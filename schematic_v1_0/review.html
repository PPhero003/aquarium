<text x="875" y="656" font-size="16" fill="#263b59" text-anchor="start">DESIGN / LAYOUT NOTES</text>
<text x="885" y="700" font-size="12" fill="#263b59" text-anchor="start">01  Keep the VIN-C2-U1-GND switching loop short.</text>
<text x="885" y="734" font-size="12" fill="#263b59" text-anchor="start">02  Place C4 at U1 pins 6 and 5; keep SW copper compact.</text>
<text x="885" y="768" font-size="12" fill="#263b59" text-anchor="start">03  Route FB away from SW, L1 and pump return current.</text>
<text x="885" y="802" font-size="12" fill="#263b59" text-anchor="start">04  Place D2 near J2/Q2 and use a short pump return loop.</text>
<text x="885" y="836" font-size="12" fill="#263b59" text-anchor="start">05  VIN_P supplies both the buck converter and the pump.</text>
<text x="885" y="870" font-size="12" fill="#263b59" text-anchor="start">06  F1 remains 0.5 A from V0.9: check pump startup current.</text>
<text x="885" y="904" font-size="12" fill="#263b59" text-anchor="start">07  This revision reorganizes wiring; original values retained.</text>
<text x="885" y="938" font-size="12" fill="#263b59" text-anchor="start">08  PCB footprints / load-current validation are not included.</text>
